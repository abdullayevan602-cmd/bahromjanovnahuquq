<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEGAL UZ - Huquqiy yordamchi</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Merriweather', 'serif'] },
                    colors: { primary: { 50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 500: '#14b8a6', 600: '#0d9488', 800: '#115e59', 900: '#134e4a' }, gold: { 50: '#fbf9f1', 200: '#eedd9d', 500: '#d4af37', 600: '#aa8c2c' } }
                }
            }
        }
    </script>

    <!-- Font Awesome & Custom CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 shadow-sm z-40 border-b border-gray-200 dark:border-gray-700 h-16 shrink-0 flex items-center justify-between px-4 lg:px-8">
        <div class="flex items-center gap-4">
            <button id="mobile-menu-btn" class="lg:hidden text-gray-500 hover:text-primary-600 transition text-xl w-10 h-10 flex items-center justify-center rounded-lg bg-gray-100 dark:bg-gray-700"><i class="fas fa-bars"></i></button>
            <div class="flex items-center gap-2.5 cursor-pointer select-none group" onclick="app.nav.goTo('home')">
                <div class="w-9 h-9 rounded-lg bg-primary-900 text-gold-500 flex items-center justify-center shadow-lg border border-gold-500/20 group-hover:scale-105 transition-transform"><i class="fas fa-balance-scale text-lg"></i></div>
                <span class="font-serif font-black text-xl text-primary-900 dark:text-white tracking-tight">LEGAL<span class="text-primary-600">UZ</span></span>
            </div>
        </div>
        <div class="hidden md:flex relative w-1/2 max-w-lg">
            <input type="text" id="global-search" data-i18n-placeholder="search_placeholder" placeholder="Huquqiy qidiruv... (qonun, hujjat, muammo)" class="w-full bg-gray-100 dark:bg-gray-700 border border-transparent focus:bg-white dark:focus:bg-gray-800 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 rounded-xl py-2.5 pl-11 pr-4 text-sm outline-none transition-all duration-300 shadow-inner">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
        </div>
        <div class="flex items-center gap-3 md:gap-5">
            <select id="lang-switcher" class="bg-gray-100 dark:bg-gray-700 text-sm font-bold outline-none cursor-pointer px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-600 focus:border-primary-500 transition">
                <option value="uz">UZ</option><option value="ru">RU</option><option value="en">EN</option>
            </select>
            <button id="theme-toggle" class="w-10 h-10 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-500 hover:text-primary-600 hover:bg-primary-50 dark:hover:bg-gray-600 transition flex items-center justify-center text-lg shadow-sm border border-gray-200 dark:border-gray-600"><i class="fas fa-moon dark:hidden"></i><i class="fas fa-sun hidden dark:block text-yellow-400"></i></button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-72 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 overflow-y-auto custom-scrollbar absolute lg:relative z-30 h-full transition-transform duration-300 -translate-x-full lg:translate-x-0 shadow-2xl lg:shadow-none">
            <nav class="p-4 space-y-1.5" id="nav-menu">
                <!-- Nav items generated via JS -->
            </nav>
            <div class="p-6 mt-8 mx-4 bg-primary-50 dark:bg-primary-900/20 rounded-xl border border-primary-100 dark:border-primary-800/50 text-center">
                <div class="w-12 h-12 bg-primary-900 text-gold-500 rounded-full flex items-center justify-center mx-auto mb-3 shadow-md"><i class="fas fa-shield-alt text-xl"></i></div>
                <h4 class="font-bold text-sm text-primary-900 dark:text-primary-300 mb-2">Huquqiy Himoya</h4>
                <p class="text-xs text-gray-600 dark:text-gray-400 leading-relaxed">Barcha ma'lumotlar O'zbekiston Respublikasi qonunchiligiga asoslangan.</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto relative bg-gray-50 dark:bg-gray-900 custom-scrollbar" id="main-scroll-area">
            <div class="max-w-6xl mx-auto p-4 md:p-8 lg:p-10 w-full" id="views"></div>
        </main>
    </div>

    <!-- Audio Player (Floating Bottom) -->
    <div id="audio-player" class="fixed bottom-6 lg:bottom-10 left-1/2 -translate-x-1/2 bg-white dark:bg-gray-800 shadow-2xl rounded-2xl px-6 py-4 border border-gray-200 dark:border-gray-700 z-50 flex items-center gap-6 transition-transform duration-300 translate-y-32 w-11/12 max-w-md">
        <div class="w-12 h-12 rounded-full bg-primary-50 dark:bg-gray-700 text-primary-600 flex items-center justify-center shrink-0 animate-pulse"><i class="fas fa-headphones-alt text-xl"></i></div>
        <div class="flex flex-col flex-1 overflow-hidden">
            <span class="text-[10px] font-black text-primary-600 tracking-wider uppercase mb-0.5" data-i18n="audio_reading">O'qilmoqda</span>
            <span class="text-sm font-bold text-gray-900 dark:text-white truncate" id="audio-title">...</span>
        </div>
        <div class="flex items-center gap-2 shrink-0">
            <button onclick="app.audio.pause()" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition flex items-center justify-center text-gray-600 dark:text-gray-300"><i class="fas fa-pause"></i></button>
            <button onclick="app.audio.resume()" class="w-10 h-10 rounded-full bg-primary-600 hover:bg-primary-500 transition text-white flex items-center justify-center shadow-md"><i class="fas fa-play"></i></button>
            <button onclick="app.audio.stop()" class="w-10 h-10 rounded-full bg-red-50 dark:bg-red-900/30 text-red-500 hover:bg-red-100 hover:text-red-600 transition flex items-center justify-center"><i class="fas fa-stop"></i></button>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-24 right-4 lg:right-10 z-50 flex flex-col gap-3"></div>

    <script src="data.js"></script>
    <script src="ai.js"></script>
    <script src="app.js"></script>
</body>
</html>
