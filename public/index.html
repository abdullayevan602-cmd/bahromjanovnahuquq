<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGAL UZ - Huquqiy yordamchi</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6', // Teal
                            600: '#0d9488',
                            800: '#115e59',
                            900: '#134e4a', // Dark Professional Teal
                        },
                        gold: {
                            500: '#d4af37', // Premium gold accent
                        }
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 antialiased overflow-hidden flex flex-col h-screen">

    <!-- Navbar -->
    <header class="bg-white dark:bg-gray-800 shadow-sm z-40 border-b border-gray-200 dark:border-gray-700 h-16 shrink-0">
        <div class="h-full px-4 max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button id="mobile-menu-btn" class="lg:hidden text-gray-500 hover:text-primary-600 text-xl">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="flex items-center gap-2 cursor-pointer" onclick="app.nav.goTo('home')">
                    <div class="w-8 h-8 rounded bg-primary-900 flex items-center justify-center text-gold-500 shadow-md border border-gold-500/30">
                        <i class="fas fa-balance-scale"></i>
                    </div>
                    <span class="font-serif font-black text-xl tracking-tight text-primary-900 dark:text-white">LEGAL<span class="text-primary-600 dark:text-primary-400">UZ</span></span>
                </div>
            </div>

            <!-- Global Search -->
            <div class="hidden md:flex relative w-1/3 max-w-md">
                <input type="text" id="global-search" data-i18n-placeholder="search_placeholder" placeholder="Huquqiy qidiruv..." 
                    class="w-full bg-gray-100 dark:bg-gray-700 border border-transparent focus:border-primary-500 focus:bg-white dark:focus:bg-gray-800 rounded-full py-2 pl-10 pr-4 text-sm outline-none transition-all duration-300">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            </div>

            <div class="flex items-center gap-3">
                <select id="lang-switcher" class="bg-transparent text-sm font-medium outline-none cursor-pointer text-gray-600 dark:text-gray-300">
                    <option value="uz">O'ZB</option>
                    <option value="ru">РУС</option>
                    <option value="en">ENG</option>
                </select>
                
                <button id="theme-toggle" class="w-10 h-10 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                    <i class="fas fa-moon dark:hidden"></i>
                    <i class="fas fa-sun hidden dark:block text-yellow-400"></i>
                </button>

                <button onclick="app.nav.goTo('profile')" class="w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-primary-100 dark:hover:bg-primary-900/30 transition">
                    <i class="fas fa-user"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex-col overflow-y-auto custom-scrollbar absolute lg:relative z-30 h-full transition-transform duration-300 -translate-x-full lg:translate-x-0 shadow-xl lg:shadow-none">
            <nav class="p-4 space-y-1" id="nav-menu">
                <!-- Injected via JS -->
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto relative bg-gray-50 dark:bg-gray-900" id="main-scroll-area">
            <div class="max-w-5xl mx-auto p-4 md:p-6 lg:p-8 w-full" id="views">
                <!-- Views injected here -->
            </div>
        </main>
    </div>

    <!-- Audio Player (Floating) -->
    <div id="audio-player" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-white dark:bg-gray-800 shadow-2xl rounded-full px-6 py-3 border border-gray-200 dark:border-gray-700 z-50 flex items-center gap-4 transition-transform duration-300 translate-y-24">
        <div class="flex flex-col">
            <span class="text-xs font-bold text-primary-600 dark:text-primary-400 uppercase tracking-wider">Audio Eshitish</span>
            <span class="text-sm font-medium text-gray-700 dark:text-gray-200 truncate w-48" id="audio-title">O'qilmoqda...</span>
        </div>
        <div class="h-8 w-px bg-gray-200 dark:bg-gray-700 mx-2"></div>
        <div class="flex items-center gap-3">
            <button onclick="app.audio.pause()" id="audio-pause" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center hover:bg-gray-200 dark:hover:bg-gray-600 transition"><i class="fas fa-pause text-gray-700 dark:text-gray-300"></i></button>
            <button onclick="app.audio.resume()" id="audio-play" class="w-10 h-10 rounded-full bg-primary-600 flex items-center justify-center hover:bg-primary-500 shadow-lg transition"><i class="fas fa-play text-white"></i></button>
            <button onclick="app.audio.stop()" class="w-10 h-10 rounded-full hover:bg-red-50 dark:hover:bg-red-900/30 flex items-center justify-center transition group"><i class="fas fa-stop text-gray-400 group-hover:text-red-500"></i></button>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed top-20 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Core Scripts -->
    <script src="data.js"></script>
    <script src="ai.js"></script>
    <script src="app.js"></script>
</body>
</html>
